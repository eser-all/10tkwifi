<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১০ টাকার ওয়াইফাই - ইন্টারনেট পেমেন্ট পোর্টাল</title>
    <style>
        :root {
            --primary: #0284c7;
            --success: #16a34a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border-radius: 16px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: var(--card-bg);
            padding: 24px;
            border-radius: var(--border-radius);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            color: var(--primary);
            margin: 0 0 5px 0;
            font-size: 1.5rem;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* মোবাইল ফ্রেন্ডলি কিউআর বক্স ও নির্দেশিকা */
        .qr-box {
            background: #f0fdf4;
            border: 2px dashed #86efac;
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.88rem;
            color: #166534;
        }

        .qr-box ol {
            margin: 8px 0 0 0;
            padding-left: 20px;
        }

        .qr-box li {
            margin-bottom: 6px;
        }

        /* বাংলা কিউআর ইমেজ হোল্ডার */
        .qr-image-container {
            margin: 12px auto;
            width: 130px;
            height: 130px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-image-container img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 6px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: #475569;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1.05rem;
            box-sizing: border-box;
            outline: none;
            transition: all 0.2s ease;
            background-color: #f8fafc;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: #15803d;
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
        }

        .message {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }

        .error { 
            background-color: #ffeeec;
            color: #dc2626; 
            display: block;
        }

        .success-msg { 
            background-color: #f0fdf4;
            color: #16a34a; 
            display: block;
        }

        /* স্পিন বা লডার ইফেক্ট */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>১০ টাকার ওয়াইফাই</h2>
    <p class="subtitle">১ ঘণ্টার জন্য ফুল-স্পিড ইন্টারনেট আনলক করুন</p>

    <!-- বিকাশ/নগদ ও বাংলা কিউআর নির্দেশিকা -->
    <div class="qr-box">
        <strong>পেমেন্ট করার নিয়ম:</strong>
        <ol>
            <li>বিকাশ বা নগদ অ্যাপ থেকে <strong>বাংলা কিউআর (Bangla QR)</strong> স্ক্যান করুন অথবা সেন্ড মানি করুন।</li>
            <li>পরিমাণ দিন: <strong>১০ টাকা</strong></li>
            <li>পেমেন্ট সফল হওয়ার পর প্রাপ্ত <strong>TrxID</strong> নিচে লিখে সাবমিট করুন।</li>
        </ol>
        
        <!-- বাংলা কিউআর কোডের ছবি রাখার জায়গা (আপনার কিউআর ইমেজ এখানে বসবে) -->
        <div class="qr-image-container">
            <img src="bangla-qr.png" alt="Bangla QR Code">
        </div>
    </div>

    <!-- পেমেন্ট সাবমিশন ফর্ম -->
    <form id="wifiForm">
        <div class="form-group">
            <label for="trxID">ট্রানজেকশন আইডি (TrxID) দিন:</label>
            <!-- মাইক্রোটিকের ম্যাক অ্যাড্রেস অটো রিড করার ভ্যারিয়েবল ($mac) -->
            <input type="hidden" id="clientMAC" value="$(mac)">
            <input type="text" id="trxID" placeholder="যেমন: BK98XYZ789" required autocomplete="off">
        </div>
        <button type="submit" id="submitBtn">ইন্টারনেট চালু করুন</button>
    </form>

    <div id="responseMessage" class="message"></div>
</div>

<script>
    document.getElementById('wifiForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const trxID = document.getElementById('trxID').value.trim();
        const clientMAC = document.getElementById('clientMAC').value;
        const msgBox = document.getElementById('responseMessage');
        const submitBtn = document.getElementById('submitBtn');

        if (!trxID) return;

        // লোডিং স্টেট চালু
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>যাচাই করা হচ্ছে...';
        msgBox.className = "message";
        msgBox.style.display = "none";

        try {
            // আপনার Firebase Cloud Function-এর সঠিক URL এখানে বসাবেন
            const firebaseAPI = "https://us-central1-YOUR_PROJECT_ID.cloudfunctions.net/verifyAndUnlockWifi";

            const response = await fetch(firebaseAPI, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    trxID: trxID,
                    clientMAC: clientMAC
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                msgBox.className = "message success-msg";
                msgBox.innerText = result.message || "পেমেন্ট সফল! ইন্টারনেট চালু হয়েছে।";
                
                // সফল হওয়ার ২.৫ সেকেন্ড পর মাইক্রোটিকের বাইপাস সাকসেস পেজে রিডাইরেক্ট করবে
                setTimeout(() => {
                    window.location.href = "http://www.msftconnecttest.com/redirect"; 
                }, 2000);
            } else {
                msgBox.className = "message error";
                msgBox.innerText = result.message || "ভুল ট্রানজেকশন আইডি! আবার চেষ্টা করুন।";
                submitBtn.disabled = false;
                submitBtn.innerText = "ইন্টারনেট চালু করুন";
            }
        } catch (error) {
            msgBox.className = "message error";
            msgBox.innerText = "সার্ভারে কানেক্ট করা যায়নি। ইন্টারনেট বা নেটওয়ার্ক চেক করুন।";
            submitBtn.disabled = false;
            submitBtn.innerText = "ইন্টারনেট চালু করুন";
        }
    });
</script>

</body>
</html>

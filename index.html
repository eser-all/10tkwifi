<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১০ টাকার ওয়াইফাই - ইন্টারনেট পেমেন্ট পোর্টাল</title>
    <style>
        :root {
            --primary: #0284c7;
            --success: #16a34a;
            --bg: #f0fdf4;
            --card-bg: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            max-width: 400px;
            width: 90%;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h2 {
            color: var(--primary);
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 20px;
        }

        .qr-box {
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #475569;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #15803d;
        }

        .message {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .error { color: #dc2626; }
        .success-msg { color: #16a34a; }
    </style>
</head>
<body>

<div class="container">
    <h2>১০ টাকার ওয়াইফাই</h2>
    <p class="subtitle">১ ঘণ্টার জন্য ফুল-স্পিড ইন্টারনেট আনলক করুন</p>

    <!-- বিকাশ/নগদ নির্দেশনা -->
    <div class="qr-box">
        <strong>ধাপ ১:</strong> বিকাশ/নগদ অ্যাপ দিয়ে নিচের বাংলা কিউআর কোডে <strong>১০ টাকা</strong> সেন্ড করুন।<br>
        <strong>ধাপ ২:</strong> পাওয়া <strong>TrxID</strong> নিচে লিখে সাবমিট করুন।
    </div>

    <!-- পেমেন্ট সাবমিশন ফর্ম -->
    <form id="wifiForm">
        <div class="form-group">
            <label for="trxID">ট্রানজেকশন আইডি (TrxID):</label>
            <!-- মাইক্রোটিকের ম্যাক অ্যাড্রেস অটো রিড করার ভ্যারিয়েবল ($mac) -->
            <input type="hidden" id="clientMAC" value="$(mac)">
            <input type="text" id="trxID" placeholder="যেমন: BK98XYZ789" required autocomplete="off">
        </div>
        <button type="submit" id="submitBtn">ইন্টারনেট চালু করুন</button>
    </form>

    <div id="responseMessage" class="message"></div>
</div>

<script>
    document.getElementById('wifiForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const trxID = document.getElementById('trxID').value.trim();
        const clientMAC = document.getElementById('clientMAC').value;
        const msgBox = document.getElementById('responseMessage');
        const submitBtn = document.getElementById('submitBtn');

        if (!trxID) return;

        submitBtn.disabled = true;
        submitBtn.innerText = "যাচাই করা হচ্ছে...";
        msgBox.className = "message";
        msgBox.innerText = "";

        try {
            // আপনার Firebase Cloud Function-এর সঠিক URL এখানে বসাবেন
            const firebaseAPI = "https://us-central1-YOUR_PROJECT_ID.cloudfunctions.net/verifyAndUnlockWifi";

            const response = await fetch(firebaseAPI, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    trxID: trxID,
                    clientMAC: clientMAC
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                msgBox.className = "message success-msg";
                msgBox.innerText = result.message || "পেমেন্ট সফল! ইন্টারনেট চালু হয়েছে।";
                
                // সফল হওয়ার ৩ সেকেন্ড পর মাইক্রোটিকের বাইপাস সাকসেস পেজে রিডাইরেক্ট করবে
                setTimeout(() => {
                    window.location.href = "http://www.msftconnecttest.com/redirect"; 
                }, 2500);
            } else {
                msgBox.className = "message error";
                msgBox.innerText = result.message || "ভুল ট্রানজেকশন আইডি! আবার চেষ্টা করুন।";
                submitBtn.disabled = false;
                submitBtn.innerText = "ইন্টারনেট চালু করুন";
            }
        } catch (error) {
            msgBox.className = "message error";
            msgBox.innerText = "সার্ভারে কানেক্ট করা যায়নি। ইন্টারনেট বা নেটওয়ার্ক চেক করুন।";
            submitBtn.disabled = false;
            submitBtn.innerText = "ইন্টারনেট চালু করুন";
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Zone - Login & Cyber Security Logging</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
    .card { background: #ffffff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 400px; padding: 25px; text-align: center; }
    .header-title { color: #1a202c; font-size: 22px; font-weight: 700; margin-bottom: 5px; }
    .subtitle { color: #718096; font-size: 13px; margin-bottom: 20px; }
    
    .form-group { text-align: left; margin-bottom: 15px; }
    label { display: block; font-weight: 600; color: #4a5568; font-size: 13px; margin-bottom: 6px; }
    input[type="text"], input[type="tel"] { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 15px; outline: none; }
    .pin-input { text-align: center; font-size: 18px !important; letter-spacing: 2px; font-weight: bold; }
    
    .btn-green { width: 100%; background: #28a745; color: #fff; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    .footer { margin-top: 15px; font-size: 11px; color: #a0aec0; }
    .error-msg { color: #e53e3e; font-size: 12px; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2 class="header-title">WiFi Zone Login</h2>
    <p class="subtitle">সাইবার নিরাপত্তার জন্য মোবাইল নম্বর দেওয়া বাধ্যতামূলক</p>

    $(if error)
      <div class="error-msg">$(error)</div>
    $(endif)

    <form name="login" id="loginForm" action="$(link-login-only)" method="post" onsubmit="return handleUserLogin(event)">
      <!-- MikroTik Hidden Variables -->
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />
      <input type="hidden" id="username" name="username" />
      <input type="hidden" id="password" name="password" />

      <!-- User Mobile Number Input -->
      <div class="form-group">
        <label for="user_phone">আপনার মোবাইল নম্বর:</label>
        <input type="tel" id="user_phone" placeholder="017xxxxxxxx" required pattern="[0-9]{11}">
      </div>

      <!-- Voucher Pin Input -->
      <div class="form-group">
        <label for="pin_code">স্ক্র্যাচ কার্ডের পিন (PIN):</label>
        <input type="text" id="pin_code" class="pin-input" placeholder="e.g. 849204" required autocomplete="off">
      </div>

      <button type="submit" class="btn-green" id="submitBtn">ইন্টারনেট চালু করুন</button>
    </form>

    <div class="footer">
      Device MAC: $(mac) | Protected Network
    </div>
  </div>

  <script>
    // Firebase Cloud Function Endpoint (এখানে আপনার ফায়ারবেস লিংকটি বসাবেন)
    const FIREBASE_USER_SAVE_URL = "https://us-central1-YOUR_PROJECT_ID.cloudfunctions.net/saveUserData";

    async function handleUserLogin(event) {
      event.preventDefault(); // ফরম ডিফল্ট সাবমিট থামানো

      const phone = document.getElementById('user_phone').value.trim();
      const pin = document.getElementById('pin_code').value.trim();
      const mac = "$(mac)";
      const submitBtn = document.getElementById('submitBtn');

      if (!phone || !pin) {
        alert("মোবাইল নম্বর এবং পিন কোড সঠিকভাবে দিন!");
        return false;
      }

      submitBtn.innerText = "যাচাই করা হচ্ছে...";
      submitBtn.disabled = true;

      try {
        // ১. ফায়ারবেসে Phone Number + MAC সেভ করা
        await fetch(FIREBASE_USER_SAVE_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mac: mac, phone: phone })
        });
      } catch (error) {
        console.log("Firebase sync warning:", error);
      }

      // ২. MikroTik Login Input সেট করা
      document.getElementById('username').value = pin;
      document.getElementById('password').value = pin;

      // ৩. MikroTik-এ ফরম সাবমিট করা
      document.getElementById('loginForm').submit();
    }
  </script>

</body>
</html>

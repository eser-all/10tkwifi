<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১০ টাকার ওয়াইফাই - ইন্টারনেট পেমেন্ট পোর্টাল</title>
    <style>
        :root {
            --primary: #38bdf8;
            --success: #22c55e;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 0;
            border: none;
            box-shadow: none;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h2 {
            color: var(--primary);
            margin: 0 0 8px 0;
            font-size: 1.7rem;
            font-weight: 800;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* পেমেন্ট নির্দেশিকা (কিউআর ইমেজ বক্স সম্পূর্ণ মুছে দেওয়া হয়েছে) */
        .qr-box {
            background: #064e3b;
            border: 2px dashed #059669;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
            font-size: 0.95rem;
            color: #a7f3d0;
            font-weight: 700;
        }

        .qr-box ol {
            margin: 8px 0 0 0;
            padding-left: 20px;
        }

        .qr-box li {
            margin-bottom: 8px;
            font-weight: 700;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            outline: none;
            transition: all 0.2s ease;
            background-color: #0f172a;
            color: #ffffff;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            background-color: var(--success);
            color: white;
            border: none;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: #16a34a;
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        .message {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 800;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .error { 
            background-color: #7f1d1d;
            color: #fca5a5; 
            display: block;
        }

        .success-msg { 
            background-color: #064e3b;
            color: #6ee7b7; 
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>১০ টাকার ওয়াইফাই</h2>
    <p class="subtitle">১ ঘণ্টার জন্য ফুল-স্পিড ইন্টারনেট আনলক করুন</p>

    <!-- পেমেন্ট করার নির্দেশিকা -->
    <div class="qr-box">
        <strong>পেমেন্ট করার নিয়ম:</strong>
        <ol>
            <li>বিকাশ/নগদ অ্যাপ দিয়ে দোকানে থাকা বাংলা কিউআর কোডে ১০ টাকা পেমেন্ট করুন।</li>
            <li>পেমেন্ট সফল হওয়ার পর প্রাপ্ত <strong>TrxID</strong> নিচে লিখে সাবমিট করুন।</li>
        </ol>
    </div>

    <!-- পেমেন্ট সাবমিশন ফর্ম -->
    <form id="wifiForm">
        <div class="form-group">
            <label for="trxID">ট্রানজেকশন আইডি (TrxID) দিন:</label>
            <input type="hidden" id="clientMAC" value="$(mac)">
            <input type="text" id="trxID" placeholder="যেমন: BK98XYZ789" required autocomplete="off">
        </div>
        <button type="submit" id="submitBtn">ইন্টারনেট চালু করুন</button>
    </form>

    <div id="responseMessage" class="message"></div>
</div>

<script>
    document.getElementById('wifiForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const trxID = document.getElementById('trxID').value.trim();
        const clientMAC = document.getElementById('clientMAC').value;
        const msgBox = document.getElementById('responseMessage');
        const submitBtn = document.getElementById('submitBtn');

        if (!trxID) return;

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>যাচাই করা হচ্ছে...';
        msgBox.className = "message";
        msgBox.style.display = "none";

        try {
            const firebaseAPI = "https://us-central1-YOUR_PROJECT_ID.cloudfunctions.net/verifyAndUnlockWifi";

            const response = await fetch(firebaseAPI, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    trxID: trxID,
                    clientMAC: clientMAC
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                msgBox.className = "message success-msg";
                msgBox.innerText = result.message || "পেমেন্ট সফল! ইন্টারনেট চালু হয়েছে।";
                
                setTimeout(() => {
                    window.location.href = "http://www.msftconnecttest.com/redirect"; 
                }, 2000);
            } else {
                msgBox.className = "message error";
                msgBox.innerText = result.message || "ভুল ট্রানজেকশন আইডি! আবার চেষ্টা করুন।";
                submitBtn.disabled = false;
                submitBtn.innerText = "ইন্টারনেট চালু করুন";
            }
        } catch (error) {
            msgBox.className = "message error";
            msgBox.innerText = "সার্ভারে কানেক্ট করা যায়নি। ইন্টারনেট বা নেটওয়ার্ক চেক করুন।";
            submitBtn.disabled = false;
            submitBtn.innerText = "ইন্টারনেট চালু করুন";
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Zone - Internet Packages</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background: #f0f2f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }
    .card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
      padding: 25px;
      text-align: center;
    }
    .header-title {
      color: #1a202c;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .subtitle {
      color: #718096;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .notice-box {
      background: #ebf8ff;
      border-left: 4px solid #3182ce;
      color: #2b6cb0;
      font-size: 12px;
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
      text-align: left;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      color: #4a5568;
      font-size: 14px;
      margin-bottom: 8px;
    }
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 15px;
      color: #2d3748;
      outline: none;
      background: #fff;
    }
    select:focus {
      border-color: #e2136e;
    }
    .bkash-btn {
      width: 100%;
      background: #e2136e;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: background 0.2s ease;
    }
    .bkash-btn:hover {
      background: #c20d5d;
    }
    .footer {
      margin-top: 20px;
      color: #a0aec0;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 class="header-title">WiFi Internet Zone</h2>
    <p class="subtitle">সহজেই প্যাকেজ কিনে ইন্টারনেট ব্যবহার করুন</p>

    <div class="notice-box">
      ⚡ <strong>বিশেষ দ্রষ্টব্য:</strong> প্রতিটি প্যাকেজ কেবল <strong>১টি ডিভাইসে</strong> ব্যবহারের জন্য প্রযোজ্য।
    </div>

    <!-- Payment Form -->
    <form action="https://your-firebase-api.cloudfunctions.net/bkashPay" method="POST">
      
      <!-- MikroTik Variable Fields (অটোমেটিক ডায়নামিক ডেটা ক্যাপচার) -->
      <input type="hidden" name="mac" value="$(mac)">
      <input type="hidden" name="ip" value="$(ip)">
      <input type="hidden" name="link_login_only" value="$(link-login-only)">

      <div class="form-group">
        <label for="package_id">আপনার পছন্দমতো প্যাকেজ বেছে নিন:</label>
        <select name="package_id" id="package_id" required>
          <option value="pkg_10tk_1hr">১০ টাকা — ১ ঘণ্টা</option>
          <option value="pkg_20tk_3hr">২০ টাকা — ৩ ঘণ্টা</option>
          <option value="pkg_50tk_3day">৫০ টাকা — ৩ দিন</option>
          <option value="pkg_100tk_1wk">১০০ টাকা — ১ সপ্তাহ</option>
          <option value="pkg_130tk_2wk">১৩০ টাকা — ২ সপ্তাহ</option>
          <option value="pkg_200tk_1m">২০০ টাকা — ১ মাস</option>
        </select>
      </div>

      <button type="submit" class="bkash-btn">
        bKash দিয়ে পেমেন্ট করুন
      </button>
    </form>

    <div class="footer">
      Device MAC: $(mac) | Protected by MikroTik Hotspot
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১০ টাকার ওয়াইফাই - ইন্টারনেট পেমেন্ট পোর্টাল</title>
    <style>
        :root {
            --primary: #38bdf8;
            --primary-glow: rgba(56, 189, 248, 0.4);
            --success: #22c55e;
            --bg: #0b132b;
            --card-bg: #1c2541;
            --text: #ffffff;
            --text-muted: #cbd5e1;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
            color: var(--text);
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: stretch;
        }

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: rgba(28, 37, 65, 0.95);
            padding: 24px 20px;
            border: none;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: none;
        }

        /* অ্যানিমেটেড ওয়াইফাই আইকন */
        .wifi-icon-wrapper {
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wifi-icon {
            width: 80px;
            height: 80px;
            color: var(--primary);
            filter: drop-shadow(0 0 10px var(--primary-glow));
            animation: pulseGlow 2s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.4;
                filter: drop-shadow(0 0 2px var(--primary));
                transform: scale(0.98);
            }
            50% {
                opacity: 1;
                filter: drop-shadow(0 0 25px var(--primary));
                transform: scale(1.05);
            }
            100% {
                opacity: 0.4;
                filter: drop-shadow(0 0 2px var(--primary));
                transform: scale(0.98);
            }
        }

        h2 {
            color: #ffffff;
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--primary);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .qr-box {
            background: rgba(6, 78, 59, 0.6);
            border: 2px dashed #10b981;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 25px;
            text-align: left;
            font-size: 1rem;
            color: #a7f3d0;
            backdrop-filter: blur(5px);
        }

        .qr-box strong {
            font-size: 1.05rem;
            color: #34d399;
        }

        .qr-box ol {
            margin: 10px 0 0 0;
            padding-left: 20px;
        }

        .qr-box li {
            margin-bottom: 8px;
            font-weight: 600;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 1.05rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text-muted);
        }

        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 16px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: 800;
            outline: none;
            transition: all 0.3s ease;
            background-color: #0b132b;
            color: #ffffff;
            text-align: center;
            letter-spacing: 1px;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border: none;
            padding: 18px;
            font-size: 1.25rem;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
            letter-spacing: 0.5px;
        }

        button:active {
            transform: scale(0.97);
        }

        button:hover {
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.6);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            box-shadow: none;
        }

        .message {
            margin-top: 18px;
            font-size: 1rem;
            font-weight: 800;
            padding: 14px;
            border-radius: 10px;
            display: none;
        }

        .error { 
            background-color: rgba(127, 29, 29, 0.8);
            color: #fca5a5; 
            border: 1px solid #ef4444;
            display: block;
        }

        .success-msg { 
            background-color: rgba(6, 78, 59, 0.8);
            color: #6ee7b7; 
            border: 1px solid #10b981;
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="wifi-icon-wrapper">
        <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14 0"></path>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20" stroke-width="3"></line>
        </svg>
    </div>

    <h2>১০ টাকার ওয়াইফাই</h2>
    <p class="subtitle">১ ঘণ্টার জন্য ফুল-স্পিড ইন্টারনেট আনলক করুন</p>

    <div class="qr-box">
        <strong>পেমেন্ট করার নিয়ম:</strong>
        <ol>
            <li>বিকাশ/নগদ অ্যাপ দিয়ে দোকানে থাকা বাংলা কিউআর কোডে ১০ টাকা পেমেন্ট করুন।</li>
            <li>পেমেন্ট করার মোবাইল নম্বর এবং প্রাপ্ত <strong>TrxID</strong> নিচে লিখে সাবমিট করুন।</li>
        </ol>
    </div>

    <form id="wifiForm">
        <input type="hidden" id="clientMAC" value="$(mac)">
        
        <!-- ইউজার ফোন নম্বর ইনপুট ফিল্ড (১১ ডিজিট) -->
        <div class="form-group">
            <label for="phone">মোবাইল নম্বর দিন:</label>
            <input type="tel" id="phone" placeholder="017XXXXXXXX" pattern="^01[3-9]\d{8}$" maxlength="11" required autocomplete="off">
        </div>

        <!-- ট্রানজেকশন আইডি ইনপুট ফিল্ড -->
        <div class="form-group">
            <label for="trxID">ট্রানজেকশন আইডি (TrxID) দিন:</label>
            <input type="text" id="trxID" placeholder="যেমন: BK98XYZ789" required autocomplete="off">
        </div>
        
        <button type="submit" id="submitBtn">ইন্টারনেট চালু করুন</button>
    </form>

    <div id="responseMessage" class="message"></div>
</div>

<script>
    document.getElementById('wifiForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const phone = document.getElementById('phone').value.trim();
        const trxID = document.getElementById('trxID').value.trim();
        const clientMAC = document.getElementById('clientMAC').value;
        const msgBox = document.getElementById('responseMessage');
        const submitBtn = document.getElementById('submitBtn');

        // ১১ ডিজিট মোবাইল নম্বর চেক (বাংলাদেশী অপারেটর ফরম্যাট)
        const phonePattern = /^01[3-9]\d{8}$/;
        if (!phonePattern.test(phone)) {
            msgBox.className = "message error";
            msgBox.innerText = "দয়া করে সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন (যেমন: 017XXXXXXXX)।";
            return;
        }

        if (!trxID) {
            msgBox.className = "message error";
            msgBox.innerText = "ট্রানজেকশন আইডি দিন।";
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>যাচাই করা হচ্ছে...';
        msgBox.className = "message";
        msgBox.style.display = "none";

        try {
            const firebaseAPI = "https://us-central1-YOUR_PROJECT_ID.cloudfunctions.net/verifyAndUnlockWifi";

            const response = await fetch(firebaseAPI, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    phone: phone,
                    trxID: trxID,
                    clientMAC: clientMAC
                })
            });

            const result = await response.json();

            if (response.ok && result.success) {
                msgBox.className = "message success-msg";
                msgBox.innerText = result.message || "পেমেন্ট সফল! ইন্টারনেট চালু হয়েছে।";
                
                setTimeout(() => {
                    window.location.href = "http://www.msftconnecttest.com/redirect"; 
                }, 2000);
            } else {
                msgBox.className = "message error";
                msgBox.innerText = result.message || "তথ্য সঠিক নয়! আবার চেষ্টা করুন।";
                submitBtn.disabled = false;
                submitBtn.innerText = "ইন্টারনেট চালু করুন";
            }
        } catch (error) {
            msgBox.className = "message error";
            msgBox.innerText = "সার্ভারে কানেক্ট করা যায়নি। ইন্টারনেট বা নেটওয়ার্ক চেক করুন।";
            submitBtn.disabled = false;
            submitBtn.innerText = "ইন্টারনেট চালু করুন";
        }
    });
</script>

</body>
</html>
